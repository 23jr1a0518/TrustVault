<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustVault — Secure Document Vault Authentication</title>
    <meta name="description" content="Enterprise-grade zero-trust document vault with cryptographic audit integrity.">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Cyber Theme -->
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .login-card {
            width: 100%;
            max-width: 440px;
            padding: 2.5rem;
        }
        .quick-account-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.78rem;
            padding: 0.4rem 0.65rem;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
        }
        .quick-account-btn:hover {
            background: rgba(56, 189, 248, 0.12);
            color: var(--primary);
            border-color: rgba(56, 189, 248, 0.3);
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="glass-panel login-card">
        <!-- Brand Header -->
        <div class="text-center mb-4">
            <div class="brand-badge justify-content-center mb-2">
                <div class="brand-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    </svg>
                </div>
                <span>TrustVault</span>
            </div>
            <p class="text-muted" style="font-size:0.875rem">Zero-Trust Document Vault & Audit-Chain Platform</p>
        </div>

        <!-- Alert Container -->
        <div id="login-alert" class="alert alert-danger py-2 px-3 mb-3 d-none" style="font-size:0.85rem;background:rgba(239,68,68,0.15);border-color:rgba(239,68,68,0.3);color:#fca5a5" role="alert"></div>

        <!-- Login Form -->
        <form id="login-form">
            <div class="mb-3">
                <label for="email" class="form-label text-secondary" style="font-size:0.85rem">Corporate Email</label>
                <input type="email" class="form-control-custom" id="email" placeholder="name@company.com" required autocomplete="username">
            </div>

            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label for="password" class="form-label text-secondary mb-0" style="font-size:0.85rem">Password</label>
                    <button type="button" id="btn-toggle-pwd" class="btn p-0 text-muted" style="font-size:0.75rem;border:none;background:none">Show</button>
                </div>
                <input type="password" class="form-control-custom" id="password" placeholder="••••••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" id="btn-login-submit" class="btn-primary-custom w-100 justify-content-center py-2 mt-2">
                Sign In to Vault
            </button>
        </form>

        <!-- Quick Demo Accounts -->
        <div class="mt-4 pt-3 border-top border-secondary border-opacity-25">
            <div class="text-muted mb-2" style="font-size:0.75rem;text-transform:uppercase;letter-spacing:0.05em">
                Demo Quick-Fill Accounts:
            </div>
            <div class="d-flex flex-wrap gap-2">
                <button type="button" class="quick-account-btn" onclick="fillDemo('admin@trustvault.local', 'AdminPass123!')">
                    Admin
                </button>
                <button type="button" class="quick-account-btn" onclick="fillDemo('owner@trustvault.local', 'OwnerPass123!')">
                    Owner
                </button>
                <button type="button" class="quick-account-btn" onclick="fillDemo('viewer@trustvault.local', 'ViewerPass123!')">
                    Viewer
                </button>
                <button type="button" class="quick-account-btn" onclick="fillDemo('disabled@trustvault.local', 'DisabledPass123!')">
                    Disabled
                </button>
            </div>
        </div>

        <!-- Security Footer -->
        <div class="text-center mt-4">
            <span class="status-pill success" style="font-size:0.7rem">
                <span class="pulse-dot"></span> SHA-256 Tamper-Evident Active
            </span>
        </div>
    </div>
</div>

<script>
    function fillDemo(email, pass) {
        document.getElementById('email').value = email;
        document.getElementById('password').value = pass;
    }

    const toggleBtn = document.getElementById('btn-toggle-pwd');
    const pwdInput = document.getElementById('password');
    if (toggleBtn && pwdInput) {
        toggleBtn.addEventListener('click', () => {
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                toggleBtn.innerText = 'Hide';
            } else {
                pwdInput.type = 'password';
                toggleBtn.innerText = 'Show';
            }
        });
    }

    const form = document.getElementById('login-form');
    const alertBox = document.getElementById('login-alert');
    const submitBtn = document.getElementById('btn-login-submit');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.classList.add('d-none');
        alertBox.innerText = '';

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Authenticating...';

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password }),
                credentials: 'same-origin'
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.message || 'Invalid email or password');
            }

            // Redirect to dashboard
            window.location.href = '/index.html';
        } catch (err) {
            alertBox.innerText = err.message || 'Authentication failed. Please verify credentials.';
            alertBox.classList.remove('d-none');
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = 'Sign In to Vault';
        }
    });
</script>

</body>
</html>
