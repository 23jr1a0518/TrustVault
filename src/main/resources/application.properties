# ==============================================================================
# TRUSTVAULT APPLICATION CONFIGURATION
# ==============================================================================

# Server Network & Port Configuration (Render binds to $PORT on 0.0.0.0)
server.port=${PORT:8080}
server.address=0.0.0.0

spring.profiles.default=dev

# Database DataSource (Supabase PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db.nxjtgudsmeolyolrgdqu.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# Session & Security Cookie Hardening
server.servlet.session.timeout=120m
server.servlet.session.cookie.name=TRUSTVAULT_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAMESITE:lax}

# Multipart File Upload Bounds
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Supabase Storage Configuration
supabase.url=${SUPABASE_URL:https://nxjtgudsmeolyolrgdqu.supabase.co}
supabase.secret-key=${SUPABASE_SECRET_KEY:}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:trustvault-documents}

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
